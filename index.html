<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/style.css">
</head>

<body>
    <div class="container">
        <div class="calculator">
            <input type="text" class="input" placeholder="0" id="input">
            <div class="c-btn">
                <div class="row"><button class="ac" onclick="ac()">AC</button><button class="operator" onclick="del()">Del</button><button
                        class="operator" onclick="btn('/')">/</button></div>
                <div class="row"><button onclick="btn('7')">7</button><button onclick="btn('8')">8</button><button onclick="btn('9')">9</button><button
                        class="operator" onclick="btn('*')">*</button></div>
                <div class="row"><button onclick="btn('4')">4</button><button onclick="btn('5')">5</button><button onclick="btn('6')">6</button><button
                        class="operator" onclick="btn('-')">-</button></div>
                <div class="row"><button onclick="btn('1')">1</button><button onclick="btn('2')">2</button><button onclick="btn('3')">3</button><button
                        class="operator" onclick="btn('+')">+</button></div>
                <div class="row"><button onclick="btn('00')">00</button><button onclick="btn('0')">0</button><button onclick="btn('.')">.</button><button
                        class="equalsto" onclick="equalsto()">=</button></div>
            </div>
        </div>
    </div>
    <script src="./assets/script.js"></script>
</body>

</html>
